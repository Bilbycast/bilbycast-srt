[package]
name = "srt-transport"
version = "0.3.7"
edition = "2024"
description = "Async I/O transport layer for the SRT protocol"
license = "MPL-2.0"

[dependencies]
srt-protocol = { path = "../srt-protocol" }
tokio = { version = "1.53.1", features = ["net", "rt-multi-thread", "time", "sync", "macros"] }
socket2 = { version = "0.6.5", features = ["all"] }
log = "0.4.34"
bytes = "1.12.1"
bitflags = "2.13.2"
rand = "0.10.3"

[dev-dependencies]
env_logger = "0.11"
