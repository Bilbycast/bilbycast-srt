[package]
name = "srt-protocol"
version = "0.3.3"
edition = "2024"
description = "Pure Rust implementation of the SRT (Secure Reliable Transport) protocol"
license = "MPL-2.0"

[dependencies]
bytes = "1.11.1"
bitflags = "2.11.1"
log = "0.4.29"
rand = "0.10.1"

# Encryption (feature-gated, all pure Rust)
# The whole suite is now on the RustCrypto hybrid-array generation:
# aes-gcm 0.11 (aead 0.6 / cipher 0.5) finally caught up with the aes 0.9 /
# ctr 0.10 / sha1 0.11 / hmac 0.13 / aes-kw 0.3 set the rest of this
# manifest already tracked, so the old generic-array straddle is gone.
# Keep them advancing together — mixing generations breaks Block alignment.
aes = { version = "0.9.0", optional = true }
ctr = { version = "0.10.0", optional = true }
aes-gcm = { version = "0.11.0", optional = true }
pbkdf2 = { version = "0.13.0", optional = true }
sha1 = { version = "0.11", optional = true }
hmac = { version = "0.13", optional = true }
aes-kw = { version = "0.3.0", optional = true }

[features]
default = ["encryption"]
encryption = ["dep:aes", "dep:ctr", "dep:aes-gcm", "dep:pbkdf2", "dep:sha1", "dep:hmac", "dep:aes-kw"]

[dev-dependencies]
